[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "model-doctor"
version = "1.0.0"
description = "Automated ML audit toolkit: finds leakage, contamination, misleading metrics, overfitting, data-quality and imbalance problems."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.2",
]

[project.scripts]
model-doctor = "model_doctor.cli:main"

[tool.setuptools]
packages = ["model_doctor", "model_doctor.checks"]